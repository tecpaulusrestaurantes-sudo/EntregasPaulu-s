<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paulu's — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --teal-deep:#0d5c50;
    --teal:#12786a;
    --teal-light:#e4efec;
    --gold:#c9a24d;
    --gold-light:#f1e4c2;
    --cream:#f7f3ea;
    --paper:#fffdf8;
    --ink:#20302c;
    --ink-soft:#5c6c66;
    --line:#e3ddca;
    --danger:#b5473a;
    --radius:14px;
    --shadow:0 6px 20px rgba(20,40,35,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--gold-light);}

  /* ---- App shell ---- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  header.topbar{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    position:sticky;top:0;z-index:40;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:42px;width:auto;display:block;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .brand-text .name{font-family:'Fraunces',serif;font-size:19px;color:var(--teal-deep);}
  .nav-toggle{display:flex;background:var(--teal-light);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap;}
  .nav-toggle button{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:600;color:var(--teal-deep);opacity:.6;transition:.15s;
  }
  .nav-toggle button.active{background:var(--teal-deep);color:#fff;opacity:1;box-shadow:var(--shadow);}
  .who-badge{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .who-badge b{color:var(--teal-deep);}
  .who-badge button{background:none;border:none;color:var(--danger);font-size:11.5px;font-weight:600;text-decoration:underline;padding:0;}

  main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:26px 20px 100px;}

  /* ---- Loja: identificação ---- */
  .id-bar{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;}
  .field select,.field input{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;background:#fff;color:var(--ink);
  }
  .field select:focus,.field input:focus{outline:none;border-color:var(--teal);}
  .field input[readonly]{background:var(--teal-light);color:var(--teal-deep);font-weight:600;}

  .search-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{
    flex:1;min-width:220px;border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-size:14.5px;background:var(--paper);
  }
  .search-row input:focus{outline:none;border-color:var(--teal);}

  .cat-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-pills button{
    border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .cat-pills button.active{background:var(--gold);border-color:var(--gold);color:#fff;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;
  }
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s;
  }
  .card:hover{transform:translateY(-2px);}
  .card .photo{
    width:100%;aspect-ratio:1/1;background:var(--teal-light) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:12px;
  }
  .card .photo svg{width:34px;height:34px;opacity:.4;}
  .card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card .pname{font-size:14px;font-weight:600;line-height:1.3;min-height:36px;}
  .card .pcat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .card .pcat.restrito{color:var(--gold);}
  .stepper{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--teal-light);border-radius:9px;padding:5px;}
  .stepper button{
    width:30px;height:30px;border-radius:7px;border:none;background:var(--paper);color:var(--teal-deep);font-size:17px;font-weight:700;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .stepper button:active{transform:scale(.95);}
  .stepper .qty{font-weight:700;font-size:15px;min-width:26px;text-align:center;color:var(--teal-deep);}
  .stepper input.qty-input{
    width:56px;border:none;background:transparent;text-align:center;font-weight:700;font-size:14px;color:var(--teal-deep);
  }
  .stepper input.qty-input:focus{outline:none;}
  .medida-tag{font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;background:var(--teal-light);border-radius:999px;padding:4px;width:fit-content;}
  .subtabs button{border:none;background:transparent;padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--teal-deep);opacity:.65;}
  .subtabs button.active{background:var(--teal-deep);color:#fff;opacity:1;}
  .qty-compare{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);}
  .qty-compare b{color:var(--ink);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .display{font-size:22px;color:var(--teal-deep);margin-bottom:8px;}

  /* ---- Cart FAB + drawer ---- */
  .cart-fab{
    position:fixed;right:22px;bottom:22px;background:var(--teal-deep);color:#fff;border:none;border-radius:999px;
    padding:14px 22px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;box-shadow:0 10px 26px rgba(13,92,80,.35);z-index:45;
  }
  .cart-fab .badge{background:var(--gold);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(20,32,28,.42);z-index:60;display:flex;justify-content:flex-end;}
  .drawer{
    width:min(400px,92vw);background:var(--paper);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);
  }
  .drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer header h3{margin:0;font-size:18px;color:var(--teal-deep);}
  .drawer header button{background:none;border:none;font-size:22px;color:var(--ink-soft);}
  .drawer .items{flex:1;overflow-y:auto;padding:12px 20px;}
  .cart-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-line img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--teal-light);}
  .cart-line .info{flex:1;}
  .cart-line .info .n{font-size:13.5px;font-weight:600;}
  .cart-line .stepper{padding:3px;}
  .cart-line .stepper button{width:24px;height:24px;font-size:14px;}
  .cart-line .rm{background:none;border:none;color:var(--danger);font-size:12px;font-weight:600;margin-top:4px;}
  .drawer footer{padding:16px 20px 20px;border-top:1px solid var(--line);}
  .btn-primary{
    width:100%;background:var(--teal-deep);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;box-shadow:var(--shadow);
  }
  .btn-primary:disabled{background:#b9c4c1;cursor:not-allowed;box-shadow:none;}
  .btn-secondary{background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center;}

  /* ---- Confirmation ---- */
  .confirm{
    max-width:420px;margin:60px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:40px 30px;box-shadow:var(--shadow);
  }
  .confirm .check{
    width:64px;height:64px;border-radius:50%;background:var(--teal-light);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;
  }

  /* ---- Login gates (loja/estoque/nutri/admin) ---- */
  .login-gate{max-width:360px;margin:70px auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);text-align:center;}
  .login-gate .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .login-gate select,.login-gate input{width:100%;text-align:center;margin:8px 0;}
  .login-gate .btn-primary{margin-top:10px;}

  /* ---- Admin ---- */
  .admin-tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .admin-tabs button{background:none;border:none;padding:10px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .admin-tabs button.active{color:var(--teal-deep);border-color:var(--gold);}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;}
  .panel h3{margin:0 0 14px;font-size:16px;color:var(--teal-deep);}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
  .form-row .field{min-width:150px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink);margin:4px 0 12px;}
  .checkbox-row input{width:16px;height:16px;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);}
  table.admin-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.admin-table img{width:38px;height:38px;object-fit:cover;border-radius:7px;background:var(--teal-light);}
  table.admin-table input.inline-pass{width:110px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;}
  .row-actions button{border:none;background:none;font-size:12.5px;font-weight:600;margin-right:12px;padding:0;}
  .row-actions .edit{color:var(--teal-deep);}
  .row-actions .del{color:var(--danger);}
  .role-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--teal-light);color:var(--teal-deep);}

  .order-card{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  .order-card .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  .order-card .meta b{color:var(--ink);}
  .order-card ul{margin:0;padding-left:18px;font-size:13.5px;}

  .pending-card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;background:#fff;box-shadow:var(--shadow);}
  .pending-card .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .pending-card .meta b{color:var(--ink);}
  .item-recv-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .item-recv-row:last-of-type{border-bottom:none;}
  .item-recv-row .n{flex:1;font-size:13.5px;font-weight:600;}
  .item-recv-row .solicitada{font-size:12px;color:var(--ink-soft);min-width:90px;}
  .item-recv-row input.recv-qty{width:70px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:14px;}
  .status-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;}
  .status-pill.pendente{background:var(--gold-light);color:#8a6a1f;}
  .status-pill.recebido{background:var(--teal-light);color:var(--teal-deep);}
  .origem-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--teal-light);color:var(--teal-deep);text-transform:uppercase;letter-spacing:.03em;}
  .edit-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fde3e0;color:#a3402f;text-transform:uppercase;letter-spacing:.03em;}
  .edit-banner{background:#fdf1e8;border:1px solid #f0c9a8;color:#8a4a1f;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:10px;}
  .meat-warning{background:#fde9e7;border:1.5px solid var(--danger);color:#8a2e22;font-size:13px;font-weight:700;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

  .integ-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:10px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);}
  .dot.ok{background:var(--teal);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .small-btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink);}

  .edit-item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .edit-item-row .n{flex:1;font-size:13.5px;font-weight:600;}
  .edit-item-row input.edit-qty{width:80px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:14px;}
  .edit-item-row .rm{background:none;border:none;color:var(--danger);font-size:12px;font-weight:600;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:80;
  }
  @media(max-width:640px){
    header.topbar{padding:12px 14px;}
    .brand-text .name{font-size:16px;}
    main{padding:18px 12px 100px;}
  }
</style>
</head>

let sbClient = null;
let sbClientKeyUsed = '';
function getClient(){
  if(!state.supabaseUrl || !state.supabaseKey) return null;
  const cacheKey = state.supabaseUrl + '|' + state.supabaseKey;
  if(!sbClient || sbClientKeyUsed !== cacheKey){
    sbClient = window.supabase.createClient(state.supabaseUrl, state.supabaseKey);
    sbClientKeyUsed = cacheKey;
  }
  return sbClient;
}
// Chama uma função (RPC) do Supabase e devolve sempre {ok, data, error}
async function callRpc(fn, params){
  const sb = getClient();
  if(!sb) return {ok:false, error:'Supabase não configurado.'};
  try{
    const { data, error } = await sb.rpc(fn, params);
    if(error) return {ok:false, error: error.message};
    return {ok:true, data};
  }catch(e){
    return {ok:false, error: 'Falha de conexão com o Supabase.'};
  }
}
async function saveSupabaseConfig(){
  state.supabaseUrl = state.supabaseUrlDraft.trim();
  state.supabaseKey = state.supabaseKeyDraft.trim();

  localStorageSafeSet('paulus_supabase_config', JSON.stringify({url: state.supabaseUrl, key: state.supabaseKey}));
  showToast('Integração salva.');
  await refreshCore();
}

}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const DEFAULT_SUPABASE_URL = 'https://zmfjvbvtmxwealsbxtgh.supabase.co';

async function init(){

  render();
  if(state.supabaseUrl && state.supabaseKey){ await refreshCore(); }

// Guarda só a URL/chave do Supabase no navegador, pra não precisar redigitar
// (não é dado sensível: a chave "anon" é pública por design — a segurança de
// verdade está nas regras do banco, não no sigilo dela).
function localStorageSafeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function localStorageSafeSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ /* ignora se indisponível */ }
}

async function refreshCore(){
  if(state.cartOpen || state.estoqueCartOpen || state.editingProduct || state.editingUser || state.editingPedido) return;
  if(!state.supabaseUrl || !state.supabaseKey) { render(); return; }
  const [produtosR, unidadesR, usuariosR] = await Promise.all([
    callRpc('listar_produtos', {}),
    callRpc('listar_unidades_publicas', {}),
    callRpc('listar_usuarios_publicos', {})
  ]);
  if(produtosR.ok) state.products = (produtosR.data || []).map(p=>({
    id: p.id, nome: p.nome, categoria: p.categoria, foto: p.foto,
    somenteEstoquista: p.somente_estoquista, unidadeMedida: p.unidade_medida
  }));
  if(unidadesR.ok) state.units = (unidadesR.data || []).map(u=>({id: u.id, nome: u.nome, temSenha: u.tem_senha}));
  if(usuariosR.ok) state.users = (usuariosR.data || []).map(u=>({id: u.id, nome: u.nome, papel: u.papel, unidades: u.unidades || []}));
  render();
}

function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function setQty(id, qty){
  qty = Math.max(0, round2(qty));
  if(qty === 0) delete state.cart[id];
  else state.cart[id] = qty;
  render();
}
function changeQty(id, delta){ setQty(id, (state.cart[id]||0) + delta); }

function stepFor(p){ return p && p.unidadeMedida === 'kg' ? 0.5 : 1; }
function qtyControl(p, qty, incFnName, setFnName){
  const isKg = p.unidadeMedida === 'kg';
  const step = stepFor(p);
  if(isKg){
    return `
    <div class="stepper">
      <button onclick="${incFnName}('${p.id}',-${step})">−</button>
      <input class="qty-input" type="number" step="0.1" min="0" value="${qty}" onchange="${setFnName}('${p.id}', this.value)"/>
      <button onclick="${incFnName}('${p.id}',${step})">+</button>
    </div>`;
  }
  return `
    <div class="stepper">
      <button onclick="${incFnName}('${p.id}',-1)" ${qty===0?'disabled':''}>−</button>
      <span class="qty">${qty}${p.unidadeMedida==='cx'?' cx':''}</span>
      <button onclick="${incFnName}('${p.id}',1)">+</button>
    </div>`;
}
function medidaBadge(p){
  const m = p.unidadeMedida || 'un';
  const nomes = {un:'Unidade', kg:'Peso (kg)', cx:'Caixa'};
  return m==='un' ? '' : `<span class="medida-tag">${nomes[m]}</span>`;
}

async function submitOrder(){
  if(!state.unidade || !state.solicitante.trim() || cartCount()===0) return;
  const itens = Object.entries(state.cart).map(([id, qtd])=>{
    const p = state.products.find(pp=>pp.id===id);
    return {id, nome: p ? p.nome : id, qtd, unidade: p ? (p.unidadeMedida||'un') : 'un'};
  });
  const order = {
    id: uid('ped'),
    unidade: state.unidade,
    solicitante: state.solicitante.trim(),
    origem: 'loja',
    tipoPedido: 'geral',
    itens,
    data: new Date().toISOString()
  };
  const r = await callRpc('criar_pedido', {p_id: order.id, p_unidade: order.unidade, p_solicitante: order.solicitante, p_origem: order.origem, p_tipo_pedido: order.tipoPedido, p_itens: itens});
  if(!r.ok){ showToast('Falha ao enviar o pedido: ' + r.error); return; }
  state.cart = {};
  state.cartOpen = false;
  state.confirmed = order;
  render();
}

  }

  const visibleProducts = state.products.filter(p=>!p.somenteEstoquista);

    ${cartCount()>0 ? `<button class="cart-fab" onclick="toggleCart(true)">🛒 Ver carrinho <span class="badge">${cartCount()}</span></button>` : ''}
    ${state.cartOpen ? renderCartDrawer() : ''}
  `;

  return `
    <div class="id-bar">
      <div class="field">
        <label>Unidade</label>
        <select onchange="setUnidade(this.value)">${unidadeOptions}</select>
      </div>
      <div class="field">
        <label>Nome do solicitante</label>
        <input id="loja-solicitante-input" type="text" placeholder="Seu nome" value="${esc(state.solicitante)}" oninput="setSolicitante(this.value)"/>
      </div>
      ${unit && unit.temSenha ? `<button class="small-btn" onclick="lojaLogout()">Trocar de unidade</button>` : ''}
    </div>
    <div class="subtabs">
      <button class="${subTab==='pedido'?'active':''}" onclick="setLojaSubTab('pedido')">Fazer pedido</button>
      <button class="${subTab==='acompanhar'?'active':''}" onclick="setLojaSubTab('acompanhar')">Acompanhar pedidos</button>

  `;
}

function setLojaSubTab(t){
  state.lojaSubTab = t;

}
async function loadLojaAcompanhamento(){
  if(!state.supabaseUrl || !state.supabaseKey){ state.lojaAcompData = []; render(); return; }
  state.lojaAcompLoading = true; render();
  const status = state.lojaAcompStatus==='Todos' ? '' : state.lojaAcompStatus;
  const r = await callRpc('listar_pedidos', {p_unidade: state.unidade, p_status: status, p_tipo_pedido: ''});
  state.lojaAcompData = r.ok ? (r.data||[]) : [];
  if(!r.ok) showToast('Não foi possível carregar: ' + r.error);
  state.lojaAcompData.forEach(p=>{
    if(p.status==='Pendente' && !state.lojaAcompForms[p.pedidoId]){
      const qtds = {};
      p.itens.forEach(it => qtds[it.produtoId] = it.qtdSolicitada);
      state.lojaAcompForms[p.pedidoId] = {quemEnvia:'', quemRecebe:'', situacao:'Tudo conforme', observacao:'', qtds};
    }
  });
  state.lojaAcompData.sort((a,b)=> new Date(b.data) - new Date(a.data));
  state.lojaAcompLoading = false;
  render();
}
function setLojaAcompStatus(v){ state.lojaAcompStatus = v; loadLojaAcompanhamento(); }
function setLojaAcompField(pedidoId, field, value){ state.lojaAcompForms[pedidoId][field] = value; }
function setLojaAcompQtd(pedidoId, produtoId, value){ state.lojaAcompForms[pedidoId].qtds[produtoId] = value; }

async function confirmarRecebimentoLoja(pedidoId){
  const pedido = state.lojaAcompData.find(p=>p.pedidoId===pedidoId);
  const form = state.lojaAcompForms[pedidoId];
  if(!form.quemEnvia.trim() || !form.quemRecebe.trim()){
    showToast('Preencha o motorista e quem está recebendo.');
    return;
  }
  if(pedido.tipoPedido === 'carne'){
    const confirmado = confirm('Este pedido tem itens de carne. Você já pesou os itens antes de confirmar o recebimento?');
    if(!confirmado) return;
  }
  const itens = pedido.itens.map(it => ({produtoId: it.produtoId, qtdRecebida: form.qtds[it.produtoId]}));
  const r = await callRpc('confirmar_recebimento', {p_pedido_id: pedidoId, p_quem_envia: form.quemEnvia.trim(), p_quem_recebe: form.quemRecebe.trim(), p_situacao: form.situacao, p_observacao: (form.observacao||'').trim(), p_itens: itens});
  if(r.ok){
    delete state.lojaAcompForms[pedidoId];
    showToast('Recebimento confirmado.');
    loadLojaAcompanhamento();
  } else {
    showToast('Falha ao confirmar: ' + r.error);
  }
}

function editedBanner(o){
  return o.editadoPorAdmin ? `<div class="edit-banner">✏️ Este pedido foi alterado por um administrador${o.dataEdicao ? ' em '+new Date(o.dataEdicao).toLocaleString('pt-BR') : ''}.</div>` : '';
}
function editedTag(o){
  return o.editadoPorAdmin ? `<span class="edit-tag">✏️ Editado pelo admin</span>` : '';

function meatWarning(o){
  return o.tipoPedido === 'carne' ? `<div class="meat-warning">⚖️ Pedido de carne — pese os itens antes de confirmar o recebimento.</div>` : '';
}

}
function estoqueCartCount(){ return Object.values(state.estoqueCart).reduce((a,b)=>a+b,0); }
function estoqueSetQty(id, qty){
  qty = Math.max(0, round2(qty));
  if(qty===0) delete state.estoqueCart[id];
  else state.estoqueCart[id] = qty;
  render();
}
function estoqueChangeQty(id, delta){ estoqueSetQty(id, (state.estoqueCart[id]||0) + delta); }

async function submitEstoqueOrder(){
  if(!state.estoqueUnidade || estoqueCartCount()===0) return;
  const itens = Object.entries(state.estoqueCart).map(([id, qtd])=>{
    const p = state.products.find(pp=>pp.id===id);
    return {id, nome: p ? p.nome : id, qtd, unidade: p ? (p.unidadeMedida||'un') : 'un'};
  });
  const order = {
    id: uid('ped'),
    unidade: state.estoqueUnidade,
    solicitante: state.estoqueUser.nome,
    origem: 'estoquista',
    tipoPedido: state.estoqueCarneFlag ? 'carne' : 'geral',
    itens,
    data: new Date().toISOString()
  };
  const r = await callRpc('criar_pedido', {p_id: order.id, p_unidade: order.unidade, p_solicitante: order.solicitante, p_origem: order.origem, p_tipo_pedido: order.tipoPedido, p_itens: itens});
  if(!r.ok){ showToast('Falha ao enviar o pedido: ' + r.error); return; }
  state.estoqueCart = {};
  state.estoqueCartOpen = false;
  state.estoqueCarneFlag = false;
  state.estoqueConfirmed = order;
  render();
}

        ${qtyControl(p, qty, 'estoqueChangeQty', 'estoqueSetQty')}
      </div>
    </div>`;
  }).join('');
  const gridOrEmpty = filtered.length ? `<div class="grid">${cards}</div>` : `<div class="empty-state"><div class="display">Nenhum produto encontrado</div></div>`;
  const catPills = categories.map(c=>`<button class="${state.estoqueCategoria===c?'active':''}" onclick="setEstoqueCategoria('${esc(c)}')">${esc(c)}</button>`).join('');

  return `
    <div class="id-bar">
      <div class="field"><label>Fazendo pedido como</label><input type="text" value="${esc(state.estoqueUser.nome)}" readonly/></div>
      <div class="field">
        <label>Unidade destino</label>
        <select onchange="setEstoqueUnidade(this.value)">
          <option value="" ${!state.estoqueUnidade?'selected':''} disabled>Selecione a unidade</option>
          ${unidadeOptions}
        </select>
      </div>
      <label class="checkbox-row" style="margin:0"><input type="checkbox" ${state.estoqueCarneFlag?'checked':''} onchange="state.estoqueCarneFlag=this.checked"/> 🥩 Pedido de carne</label>
      <button class="small-btn" onclick="estoqueLogout()">Sair</button>
    </div>
    <div class="search-row"><input id="estoque-search-input" type="text" placeholder="Buscar produto..." value="${esc(state.estoqueSearch)}" oninput="setEstoqueSearch(this.value)"/></div>
    ${categories.length>1?`<div class="cat-pills">${catPills}</div>`:''}
    ${gridOrEmpty}
    ${estoqueCartCount()>0 ? `<button class="cart-fab" onclick="toggleEstoqueCart(true)">🛒 Ver carrinho <span class="badge">${estoqueCartCount()}</span></button>` : ''}
    ${state.estoqueCartOpen ? renderEstoqueCartDrawer() : ''}
  `;
}

function renderEstoqueCartDrawer(){
  const lines = Object.entries(state.estoqueCart).map(([id,qty])=>{
    const p = state.products.find(pp=>pp.id===id);
    if(!p) return '';
    return `
    <div class="cart-line">
      ${p.foto?`<img src="${esc(p.foto)}"/>`:`<div style="width:44px;height:44px;border-radius:8px;background:var(--teal-light)"></div>`}
      <div class="info"><div class="n">${esc(p.nome)}</div><button class="rm" onclick="estoqueSetQty('${id}',0)">remover</button></div>
      ${qtyControl(p, qty, 'estoqueChangeQty', 'estoqueSetQty')}
    </div>`;
  }).join('');
  const canSubmit = state.estoqueUnidade && estoqueCartCount()>0;
  return `
  <div class="drawer-overlay" onclick="if(event.target===this) toggleEstoqueCart(false)">
    <div class="drawer">
      <header><h3>Seu carrinho</h3><button onclick="toggleEstoqueCart(false)">✕</button></header>
      <div class="items">${lines || '<p class="muted">Carrinho vazio.</p>'}</div>
      <footer>
        <button class="btn-primary" ${canSubmit?'':'disabled'} onclick="submitEstoqueOrder()">Enviar pedido</button>
        ${!canSubmit ? `<p class="hint">Selecione a unidade e adicione itens.</p>` : ''}
      </footer>
    </div>
  </div>`;
}

/* ================= NUTRICIONISTA ================= */
function setNutriUserId(v){ state.nutriUserId = v; }
function nutriAllowedUnits(){
  const u = state.nutriUser;
  if(!u || !u.unidades || u.unidades.length===0) return state.units;
  return state.units.filter(un => u.unidades.includes(un.nome));
}
async function tryNutriLogin(){
  if(!state.nutriUserId) return;
  const r = await callRpc('login_usuario', {p_id: state.nutriUserId, p_senha: state.nutriSenhaInput});
  if(r.ok && r.data && r.data.length){
    state.nutriAuthed = true;
    state.nutriUser = r.data[0];
    state.nutriUnidade = '';
    render();
  } else {
    showToast('Senha incorreta.');
  }
}
function nutriLogout(){
  state.nutriAuthed = false;
  state.nutriUser = null;
  state.nutriUserId = '';
  state.nutriSenhaInput = '';
  state.nutriPedidos = [];
  state.nutriHistorico = [];
  state.nutriForms = {};
  state.nutriSubTab = 'pendentes';
  render();
}
function setNutriSubTab(t){
  state.nutriSubTab = t;
  if(t==='historico') loadNutriHistorico(); else loadNutriPedidos();
}
function setNutriUnidade(v){
  state.nutriUnidade = v;
  if(state.nutriSubTab==='historico') loadNutriHistorico(); else loadNutriPedidos();
}
async function loadNutriPedidos(){
  if(!state.nutriUnidade || !state.supabaseUrl || !state.supabaseKey){ state.nutriPedidos = []; render(); return; }
  state.nutriLoading = true; render();
  const r = await callRpc('listar_pedidos', {p_unidade: state.nutriUnidade, p_status: 'Pendente', p_tipo_pedido: ''});
  state.nutriLoading = false;
  if(r.ok){
    state.nutriPedidos = r.data || [];
    state.nutriPedidos.forEach(p=>{
      if(!state.nutriForms[p.pedidoId]){
        const qtds = {};
        p.itens.forEach(it => qtds[it.produtoId] = it.qtdSolicitada);
        state.nutriForms[p.pedidoId] = {quemEnvia:'', quemRecebe: state.nutriUser ? state.nutriUser.nome : '', situacao:'Tudo conforme', observacao:'', qtds};
      }
    });
  } else {
    state.nutriPedidos = [];
    showToast('Não foi possível carregar os pedidos: ' + r.error);
  }
  render();
}
async function loadNutriHistorico(){
  if(!state.nutriUnidade || !state.supabaseUrl || !state.supabaseKey){ state.nutriHistorico = []; render(); return; }
  state.nutriLoading = true; render();
  const r = await callRpc('listar_pedidos', {p_unidade: state.nutriUnidade, p_status: 'Recebido', p_tipo_pedido: ''});
  state.nutriLoading = false;
  state.nutriHistorico = r.ok ? (r.data||[]) : [];
  if(!r.ok) showToast('Não foi possível carregar o histórico: ' + r.error);
  state.nutriHistorico.sort((a,b)=> new Date(b.dataRecebimento||b.data) - new Date(a.dataRecebimento||a.data));
  render();
}
function setNutriField(pedidoId, field, value){ state.nutriForms[pedidoId][field] = value; }
function setNutriQtd(pedidoId, produtoId, value){ state.nutriForms[pedidoId].qtds[produtoId] = value; }
async function confirmarRecebimento(pedidoId){
  const form = state.nutriForms[pedidoId];
  if(!form.quemEnvia.trim() || !form.quemRecebe.trim()){
    showToast('Preencha o motorista e a nutricionista responsável.');
    return;
  }
  const pedido = state.nutriPedidos.find(p=>p.pedidoId===pedidoId);
  const itens = pedido.itens.map(it => ({produtoId: it.produtoId, qtdRecebida: form.qtds[it.produtoId]}));
  const r = await callRpc('confirmar_recebimento', {p_pedido_id: pedidoId, p_quem_envia: form.quemEnvia.trim(), p_quem_recebe: form.quemRecebe.trim(), p_situacao: form.situacao, p_observacao: (form.observacao||'').trim(), p_itens: itens});
  if(r.ok){
    state.nutriPedidos = state.nutriPedidos.filter(p=>p.pedidoId!==pedidoId);
    delete state.nutriForms[pedidoId];
    showToast('Recebimento confirmado.');
    render();
  } else {
    showToast('Falha ao confirmar: ' + r.error);
  }
}

function itemQtyLabel(qtd, unidade){
  const u = unidade || 'un';
  return `${qtd}${u!=='un' ? ' '+u : ''}`;
}

function renderNutri(){
  if(!state.nutriAuthed){
    if(!state.users.some(u=>u.papel==='nutricionista')){
      return `<div class="empty-state"><div class="display">Nenhuma nutricionista cadastrada</div><div>Peça ao administrador para criar um usuário em Admin → Usuários.</div></div>`;
    }
    const opts = state.users.filter(u=>u.papel==='nutricionista').map(u=>`<option value="${u.id}" ${state.nutriUserId===u.id?'selected':''}>${esc(u.nome)}</option>`).join('');
    return `
      <div class="login-gate">
        <span class="eyebrow">Área da nutricionista</span>
        <h2 class="display">Identifique-se</h2>
        <select onchange="setNutriUserId(this.value)">
          <option value="" ${!state.nutriUserId?'selected':''} disabled>Selecione seu nome</option>
          ${opts}
        </select>
        <input type="password" placeholder="Senha" value="${esc(state.nutriSenhaInput)}" oninput="state.nutriSenhaInput=this.value" onkeydown="if(event.key==='Enter') tryNutriLogin()"/>
        <button class="btn-primary" onclick="tryNutriLogin()">Entrar</button>
      </div>`;
  }

  if(!state.supabaseUrl || !state.supabaseKey){
    return `<div class="empty-state"><div class="display">Integração não configurada</div><div>Peça ao administrador para conectar a planilha do Google em Admin → Integração.</div></div>`;
  }

  const allowedUnits = nutriAllowedUnits();
  const unidadeOptions = allowedUnits.map(u=>`<option ${state.nutriUnidade===u.nome?'selected':''}>${esc(u.nome)}</option>`).join('');
  const subTab = state.nutriSubTab || 'pendentes';

  let listHtml = '';
  if(subTab==='pendentes'){
    const cards = state.nutriPedidos.map(p=>{
      const form = state.nutriForms[p.pedidoId] || {quemEnvia:'',quemRecebe:'',qtds:{}};
      const itemRows = p.itens.map(it=>`
        <div class="item-recv-row">
          <div class="n">${esc(it.produto)}</div>
          <div class="solicitada">Solicitado: ${itemQtyLabel(it.qtdSolicitada, it.unidadeMedida)}</div>
          <input id="qty-${p.pedidoId}-${it.produtoId}" class="recv-qty" type="number" step="0.1" min="0" value="${esc(form.qtds[it.produtoId] ?? it.qtdSolicitada)}" oninput="setNutriQtd('${p.pedidoId}','${it.produtoId}', this.value)"/>
        </div>`).join('');
      return `
      <div class="pending-card">
        <div class="meta">
          <span><span class="origem-tag">${p.origem==='estoquista'?'Estoquista':'Unidade'}</span> ${p.tipoPedido==='carne'?'<span class="origem-tag" style="background:var(--gold-light);color:#8a6a1f">🥩 Carne</span>':''} ${editedTag(p)} &nbsp;<b>${esc(p.solicitante)}</b> solicitou em ${new Date(p.data).toLocaleString('pt-BR')}</span>
          <span class="status-pill pendente">Pendente</span>
        </div>
        ${editedBanner(p)}
        ${itemRows}
        <div class="form-row" style="margin-top:14px">
          <div class="field"><label>Motorista que entregou</label><input id="motorista-${p.pedidoId}" type="text" value="${esc(form.quemEnvia)}" oninput="setNutriField('${p.pedidoId}','quemEnvia',this.value)" placeholder="Nome do motorista"/></div>
          <div class="field"><label>Nutricionista responsável</label><input id="recebe-${p.pedidoId}" type="text" value="${esc(form.quemRecebe)}" oninput="setNutriField('${p.pedidoId}','quemRecebe',this.value)"/></div>
          <div class="field">
            <label>Situação da entrega</label>
            <select onchange="setNutriField('${p.pedidoId}','situacao',this.value)">
              <option ${form.situacao==='Tudo conforme'?'selected':''}>Tudo conforme</option>
              <option ${form.situacao==='Divergência parcial'?'selected':''}>Divergência parcial</option>
              <option ${form.situacao==='Divergência total'?'selected':''}>Divergência total</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-bottom:14px">
          <label>Observação (opcional)</label>
          <input id="obs-${p.pedidoId}" type="text" value="${esc(form.observacao||'')}" oninput="setNutriField('${p.pedidoId}','observacao',this.value)" placeholder="Ex: faltou 1kg de carne, embalagem violada, etc."/>
        </div>
        <button class="btn-primary" style="width:auto;padding:10px 22px" onclick="confirmarRecebimento('${p.pedidoId}')">Confirmar recebimento</button>
      </div>`;
    }).join('');
    listHtml = `
      ${state.nutriLoading ? '<p class="muted">Carregando pedidos da planilha...</p>' : ''}
      ${!state.nutriLoading && state.nutriUnidade && cards.length===0 ? '<div class="empty-state"><div class="display">Nenhum pedido pendente</div><div>Todos os pedidos desta unidade já foram recebidos.</div></div>' : ''}
      ${!state.nutriUnidade ? '<p class="muted">Selecione uma unidade para ver os pedidos pendentes.</p>' : ''}
      ${cards}`;
  } else {
    const cards = state.nutriHistorico.map(p=>{
      const itemRows = p.itens.map(it=>`
        <div class="item-recv-row">
          <div class="n">${esc(it.produto)}</div>
          <div class="qty-compare"><span>Enviado: <b>${itemQtyLabel(it.qtdSolicitada, it.unidadeMedida)}</b></span><span>Recebido: <b>${itemQtyLabel(it.qtdRecebida, it.unidadeMedida)}</b></span></div>
        </div>`).join('');
      return `
      <div class="pending-card">
        <div class="meta">
          <span><span class="origem-tag">${p.origem==='estoquista'?'Estoquista':'Unidade'}</span> ${editedTag(p)} &nbsp;<b>${esc(p.solicitante)}</b> solicitou em ${new Date(p.data).toLocaleString('pt-BR')}</span>
          <span class="status-pill recebido">${esc(p.situacao||'Recebido')}</span>
        </div>
        ${editedBanner(p)}
        ${itemRows}
        <div class="form-row" style="margin-top:10px">
          <div class="field"><label>Motorista</label><input type="text" value="${esc(p.quemEnvia||'')}" readonly/></div>
          <div class="field"><label>Recebido por</label><input type="text" value="${esc(p.quemRecebe||'')}" readonly/></div>
          <div class="field"><label>Data do recebimento</label><input type="text" value="${p.dataRecebimento ? new Date(p.dataRecebimento).toLocaleString('pt-BR') : '—'}" readonly/></div>
        </div>
        ${p.observacao?`<p class="muted" style="margin:0">Obs: ${esc(p.observacao)}</p>`:''}
      </div>`;
    }).join('');
    listHtml = `
      ${state.nutriLoading ? '<p class="muted">Carregando histórico da planilha...</p>' : ''}
      ${!state.nutriLoading && state.nutriUnidade && cards.length===0 ? '<div class="empty-state"><div class="display">Nenhum recebimento no histórico</div></div>' : ''}
      ${!state.nutriUnidade ? '<p class="muted">Selecione uma unidade para ver o histórico.</p>' : ''}
      ${cards}`;
  }

  return `
    <div class="id-bar">
      <div class="field"><label>Nutricionista</label><input type="text" value="${esc(state.nutriUser.nome)}" readonly/></div>
      <div class="field">
        <label>Unidade</label>
        <select onchange="setNutriUnidade(this.value)">
          <option value="" ${!state.nutriUnidade?'selected':''} disabled>Selecione a unidade</option>
          ${unidadeOptions}
        </select>
      </div>
      <button class="small-btn" onclick="${subTab==='historico'?'loadNutriHistorico()':'loadNutriPedidos()'}">Atualizar</button>
      <button class="small-btn" onclick="nutriLogout()">Sair</button>
    </div>
    <div class="subtabs">
      <button class="${subTab==='pendentes'?'active':''}" onclick="setNutriSubTab('pendentes')">Pendentes</button>
      <button class="${subTab==='historico'?'active':''}" onclick="setNutriSubTab('historico')">Histórico de recebimento</button>
    </div>
    ${listHtml}
  `;
}

}
function adminLogout(){

  render();
}
function setAdminTab(t){ state.adminTab = t; render(); if(t==='pedidos') loadAdminPedidos(); }

function openNewProduct(){ state.editingProduct = {id:null, nome:'', categoria:'', foto:'', somenteEstoquista:false, unidadeMedida:'un'}; render(); }
function openEditProduct(id){ state.editingProduct = {...state.products.find(p=>p.id===id)}; render(); }
async function saveProduct(){
  const ep = state.editingProduct;
  if(!ep.nome.trim()) return;
  const id = ep.id || uid('p');
  const r = await callRpc('salvar_produto', {
    p_admin_senha: state.adminPass, p_id: id, p_nome: ep.nome.trim(), p_categoria: ep.categoria||'',
    p_foto: ep.foto||'', p_somente_estoquista: !!ep.somenteEstoquista, p_unidade_medida: ep.unidadeMedida||'un'
  });
  if(!r.ok){ showToast(r.error || 'Falha ao salvar produto.'); return; }
  state.editingProduct = null;
  showToast('Produto salvo.');
  await refreshCore();
}
async function deleteProduct(id){
  if(!confirm('Excluir este produto?')) return;
  const r = await callRpc('excluir_produto', {p_admin_senha: state.adminPass, p_id: id});
  if(!r.ok){ showToast(r.error || 'Falha ao excluir produto.'); return; }
  showToast('Produto excluído.');
  await refreshCore();
}

function renderAdminProdutos(){
  const rows = state.products.map(p=>`
    <tr>
      <td>${p.foto?`<img src="${esc(p.foto)}"/>`:`<div style="width:38px;height:38px;border-radius:7px;background:var(--teal-light)"></div>`}</td>
      <td>${esc(p.nome)}</td>
      <td>${esc(p.categoria||'—')}</td>
      <td>${({un:'Unidade',kg:'Peso (kg)',cx:'Caixa'})[p.unidadeMedida||'un']}</td>
      <td>${p.somenteEstoquista?'<span class="role-badge">Só estoquista</span>':'<span class="muted">Todos</span>'}</td>
      <td class="row-actions">
        <button class="edit" onclick="openEditProduct('${p.id}')">Editar</button>
        <button class="del" onclick="deleteProduct('${p.id}')">Excluir</button>
      </td>
    </tr>`).join('');

  const ep = state.editingProduct;
  const formPanel = ep ? `
    <div class="panel">
      <h3>${ep.id ? 'Editar produto' : 'Novo produto'}</h3>
      <div class="form-row">
        <div class="field"><label>Nome</label><input type="text" value="${esc(ep.nome)}" oninput="state.editingProduct.nome=this.value"/></div>
        <div class="field"><label>Categoria</label><input type="text" value="${esc(ep.categoria)}" oninput="state.editingProduct.categoria=this.value" placeholder="ex: Grãos"/></div>
        <div class="field"><label>Como é medido</label>
          <select onchange="state.editingProduct.unidadeMedida=this.value">
            <option value="un" ${ (ep.unidadeMedida||'un')==='un'?'selected':''}>Unidade (un)</option>
            <option value="kg" ${ep.unidadeMedida==='kg'?'selected':''}>Peso (kg) — ex: 1kg500g = 1,5</option>
            <option value="cx" ${ep.unidadeMedida==='cx'?'selected':''}>Caixa (cx)</option>
          </select>
        </div>
        <div class="field" style="flex:2"><label>URL da foto</label><input type="text" value="${esc(ep.foto)}" oninput="state.editingProduct.foto=this.value" placeholder="https://..."/></div>
      </div>
      <label class="checkbox-row"><input type="checkbox" ${ep.somenteEstoquista?'checked':''} onchange="state.editingProduct.somenteEstoquista=this.checked"/> Visível apenas para o estoquista (não aparece na Loja)</label>
      <button class="btn-primary" style="width:auto;padding:10px 22px" onclick="saveProduct()">Salvar produto</button>
      <button class="btn-secondary" onclick="state.editingProduct=null; render()">Cancelar</button>
    </div>` : '';

  return `
    <div class="toolbar">
      <span class="muted">${state.products.length} produto(s) cadastrado(s)</span>
      <button class="small-btn" onclick="openNewProduct()">+ Novo produto</button>
    </div>
    ${formPanel}
    <div class="panel">
      <table class="admin-table">
        <thead><tr><th>Foto</th><th>Nome</th><th>Categoria</th><th>Medida</th><th>Visibilidade</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="muted">Nenhum produto cadastrado.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

async function addUnit(nome, senha){
  nome = nome.trim();
  if(!nome || state.units.some(u=>u.nome===nome)) return;
  const r = await callRpc('salvar_unidade', {p_admin_senha: state.adminPass, p_id: '', p_nome: nome, p_senha: (senha||'').trim()});
  if(!r.ok){ showToast(r.error || 'Falha ao salvar unidade.'); return; }
  showToast('Unidade salva.');
  await refreshCore();
}
async function removeUnit(id){
  if(!confirm('Excluir esta unidade?')) return;
  const r = await callRpc('excluir_unidade', {p_admin_senha: state.adminPass, p_id: id});
  if(!r.ok){ showToast(r.error || 'Falha ao excluir unidade.'); return; }
  await refreshCore();
}
async function updateUnitSenha(id, nome, senha, inputEl){
  const r = await callRpc('salvar_unidade', {p_admin_senha: state.adminPass, p_id: id, p_nome: nome, p_senha: (senha||'').trim()});
  if(!r.ok){ showToast(r.error || 'Falha ao atualizar senha.'); return; }
  showToast('Senha da unidade atualizada.');
  if(inputEl) inputEl.blur();
  await refreshCore();

function toggleUserUnidade(nome, checked){
  const eu = state.editingUser;
  const set = new Set(eu.unidades||[]);
  if(checked) set.add(nome); else set.delete(nome);
  eu.unidades = Array.from(set);

async function saveUser(){
  const eu = state.editingUser;
  if(!eu.nome.trim()){ showToast('Preencha o nome.'); return; }
  if(!eu.id && !(eu.senha||'').trim()){ showToast('Defina uma senha para o novo usuário.'); return; }
  const r = await callRpc('salvar_usuario', {
    p_admin_senha: state.adminPass, p_id: eu.id || '', p_nome: eu.nome.trim(), p_papel: eu.papel,
    p_senha: (eu.senha||'').trim() || '__MANTER__', p_unidades: eu.unidades || []
  });
  if(!r.ok){ showToast(r.error || 'Falha ao salvar usuário.'); return; }
  state.editingUser = null;
  showToast('Usuário salvo.');
  await refreshCore();
}
async function deleteUser(id){
  if(!confirm('Excluir este usuário?')) return;
  const r = await callRpc('excluir_usuario', {p_admin_senha: state.adminPass, p_id: id});
  if(!r.ok){ showToast(r.error || 'Falha ao excluir usuário.'); return; }
  showToast('Usuário excluído.');
  await refreshCore();
}

function exportXLSX(rows, filename){
  if(typeof XLSX === 'undefined'){ showToast('Biblioteca de exportação não carregou. Verifique a internet.'); return; }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = rows[0].map(()=>({wch:20}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');
  XLSX.writeFile(wb, filename);
}

async function loadAdminPedidos(){
  state.adminPedidosLoading = true; render();
  if(state.supabaseUrl && state.supabaseKey){
    const unidade = state.adminPedidosUnidade === 'Todas' ? '' : state.adminPedidosUnidade;
    const status = state.adminPedidosStatus === 'Todos' ? '' : state.adminPedidosStatus;
    const r = await callRpc('listar_pedidos', {p_unidade: unidade, p_status: status, p_tipo_pedido: ''});
    state.adminPedidosData = r.ok ? (r.data||[]) : [];
    if(!r.ok) showToast('Não foi possível carregar: ' + r.error);
  } else {
    state.adminPedidosData = [];
  }
  if(state.adminPedidosTipo !== 'Todos'){
    state.adminPedidosData = state.adminPedidosData.filter(o => (o.tipoPedido||'geral') === (state.adminPedidosTipo==='Carne'?'carne':'geral'));
  }
  state.adminPedidosData.sort((a,b)=> new Date(b.data) - new Date(a.data));
  state.adminPedidosLoading = false;
  render();
}
function setAdminPedidosFiltro(field, value){
  state[field] = value;
  loadAdminPedidos();
}
function buildPedidosExportRows(list){
  const rows = [['Data do Pedido','Unidade','Tipo de Pedido','Produto','Qtd Enviada','Qtd Recebida','Enviado por (Motorista)','Recebido por (Nutricionista)','Situação','Observação','Status','Data Recebimento']];
  list.forEach(p=>{
    p.itens.forEach(it=>{
      rows.push([
        new Date(p.data).toLocaleString('pt-BR'),
        p.unidade,
        p.tipoPedido==='carne' ? 'Carne' : 'Geral',
        it.produto + (it.unidadeMedida && it.unidadeMedida!=='un' ? ` (${it.unidadeMedida})` : ''),
        it.qtdSolicitada,
        it.qtdRecebida || '',
        p.quemEnvia || '',
        p.quemRecebe || '',
        p.situacao || '',
        p.observacao || '',
        p.status || '',
        p.dataRecebimento ? new Date(p.dataRecebimento).toLocaleString('pt-BR') : ''
      ]);
    });
  });
  return rows;
}
function exportAdminPedidos(){
  exportXLSX(buildPedidosExportRows(state.adminPedidosData), `pedidos_paulus_${Date.now()}.xlsx`);
}

/* ---- Editar pedido (admin) ---- */
function openEditPedido(pedidoId){
  const p = state.adminPedidosData.find(x=>x.pedidoId===pedidoId);
  if(!p) return;
  if(p.status === 'Recebido'){ showToast('Não é possível editar um pedido já recebido.'); return; }
  state.editingPedido = {
    pedidoId: p.pedidoId,
    unidade: p.unidade,
    solicitante: p.solicitante,
    itens: p.itens.map(it => ({id: it.produtoId, nome: it.produto, unidade: it.unidadeMedida||'un', qtd: it.qtdSolicitada}))
  };
  state.editPedidoAddId = '';
  render();
}
function closeEditPedido(){ state.editingPedido = null; render(); }
function setEditPedidoQtd(produtoId, value){
  const ep = state.editingPedido;
  const it = ep.itens.find(x=>x.id===produtoId);
  if(it) it.qtd = value;
}
function removeEditPedidoItem(produtoId){
  const ep = state.editingPedido;
  ep.itens = ep.itens.filter(x=>x.id!==produtoId);
  render();
}
function addEditPedidoItem(){
  const ep = state.editingPedido;
  const pid = state.editPedidoAddId;
  if(!pid) return;
  if(ep.itens.some(x=>x.id===pid)) return;
  const prod = state.products.find(p=>p.id===pid);
  if(!prod) return;
  ep.itens.push({id: prod.id, nome: prod.nome, unidade: prod.unidadeMedida||'un', qtd: prod.unidadeMedida==='kg' ? 0.5 : 1});
  state.editPedidoAddId = '';
  render();
}
async function saveEditedPedido(){
  const ep = state.editingPedido;
  const itens = ep.itens
    .map(it => ({id: it.id, nome: it.nome, unidade: it.unidade, qtd: round2(it.qtd)}))
    .filter(it => it.qtd > 0);
  if(itens.length === 0){ showToast('O pedido precisa ter ao menos um item.'); return; }
  const r = await callRpc('editar_pedido', {p_admin_senha: state.adminPass, p_pedido_id: ep.pedidoId, p_itens: itens});
  if(r.ok){
    showToast('Pedido atualizado. A nutricionista verá o aviso de alteração.');
    state.editingPedido = null;
    loadAdminPedidos();
  } else {
    showToast(r.error || 'Falha ao atualizar o pedido.');
  }
}
async function deletePedido(pedidoId){
  if(!confirm('Excluir este pedido definitivamente? Essa ação não pode ser desfeita.')) return;
  const r = await callRpc('excluir_pedido', {p_admin_senha: state.adminPass, p_pedido_id: pedidoId});
  if(r.ok){
    showToast('Pedido excluído.');
    loadAdminPedidos();
  } else {
    showToast(r.error || 'Falha ao excluir o pedido.');
  }
}

function render(){
  // Preserva o foco e a posição do cursor do campo que o usuário estiver digitando,
  // já que o app re-renderiza a tela inteira a cada mudança de estado.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const app = document.getElementById('app');
  let body = '';
  if(state.view==='loja') body = renderLoja();
  else if(state.view==='estoque') body = renderEstoque();
  else if(state.view==='nutri') body = renderNutri();
  else body = renderAdmin();

  app.innerHTML = `
    ${renderTopbar()}
    <main>${body}</main>
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

init();
</script>
</body>
</html>
